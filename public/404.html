<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - 页面未找到</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f7fa;color:#606266;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;text-align:center}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:60px 80px}
h1{font-size:72px;color:#409eff;margin:0 0 10px;line-height:1}
p{font-size:16px;color:#909399;margin:0 0 30px}
a{display:inline-block;padding:10px 32px;background:#409eff;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;transition:background .2s}
a:hover{background:#66b1ff}
</style>
</head>
<body>
<div class="card">
<h1>404</h1>
<p>抱歉，您访问的页面不存在</p>
<a href="/">返回首页</a>
</div>
</body>
</html>
