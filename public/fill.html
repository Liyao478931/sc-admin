<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>问卷填写</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f3f5; color: #333; line-height: 1.6; }
.header { background: linear-gradient(135deg, #1e6fff, #0d47c4); color: #fff; padding: 24px 16px 20px; text-align: center; }
.header h1 { font-size: 19px; margin-bottom: 6px; }
.header .sub { font-size: 12px; opacity: .85; white-space: pre-line; }
.header .anon { display: inline-block; margin-top: 8px; font-size: 11px; background: rgba(255,255,255,.18); padding: 3px 10px; border-radius: 20px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px; }
.card { background: #fff; border-radius: 10px; padding: 16px 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.q { margin-bottom: 14px; }
.q:last-child { margin-bottom: 0; }
.q .t { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.q .t .req { color: #e53935; margin-left: 4px; }
input[type=text], input[type=number], textarea { width: 100%; border: 1px solid #d9d9d9; border-radius: 6px; padding: 9px 10px; font-size: 14px; background: #fff; outline: none; }
input:focus, textarea:focus { border-color: #1e6fff; }
textarea { min-height: 72px; resize: vertical; }
.opt { display: flex; align-items: flex-start; margin-bottom: 7px; font-size: 14px; cursor: pointer; }
.opt input { width: 17px; height: 17px; margin: 3px 8px 0 0; flex-shrink: 0; accent-color: #1e6fff; }
.opt .txt { flex: 1; }
.score-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.score-table th, .score-table td { border: 1px solid #e0e0e0; padding: 6px 5px; text-align: left; }
.score-table th { background: #f7f8fa; font-weight: 600; }
.score-table .dim { background: #eef4ff; font-weight: 600; }
.score-table input { width: 56px; text-align: center; padding: 5px; font-size: 14px; }
.score-table .total-row td { font-weight: 700; background: #fffbe6; }
.submit-btn { display: block; width: 100%; max-width: 640px; margin: 4px auto 30px; background: #1e6fff; color: #fff; border: none; border-radius: 24px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
.submit-btn:active { background: #0d47c4; }
.submit-btn:disabled { background: #9db9f0; cursor: not-allowed; }
.toast { position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 16px 24px; border-radius: 10px; font-size: 14px; z-index: 99; display: none; max-width: 80%; text-align: center; }
.footer { text-align: center; color: #aaa; font-size: 11px; padding: 10px 0 20px; }
.thanks { display: none; position: fixed; inset: 0; background: #f2f3f5; z-index: 50; overflow-y: auto; }
.thanks .box { max-width: 480px; margin: 10vh auto; background: #fff; border-radius: 14px; padding: 40px 30px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
.thanks .icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; }
.thanks .icon svg { width: 40px; height: 40px; }
.thanks h2 { font-size: 21px; color: #2e7d32; margin: 0 0 10px; }
.thanks p { font-size: 14px; color: #666; line-height: 1.8; margin: 6px 0; }
.error-box { max-width: 480px; margin: 12vh auto; background: #fff; border-radius: 14px; padding: 40px 30px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
.error-box .icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%; background: #fdecea; display: flex; align-items: center; justify-content: center; }
.error-box h2 { font-size: 19px; color: #c62828; margin: 0 0 10px; }
.error-box p { font-size: 14px; color: #666; }
</style>
</head>
<body>
<div class="header" id="header" style="display:none">
  <h1 id="qTitle">问卷填写</h1>
  <div class="sub" id="qDesc"></div>
  <div class="anon" id="qAnon">🔒 匿名问卷</div>
</div>

<div class="wrap" id="qWrap" style="display:none">
  <div class="card"><div id="qList"></div></div>
  <button class="submit-btn" id="submitBtn" onclick="submitSurvey()">提 交 问 卷</button>
  <div class="footer" id="qFooter"></div>
</div>

<div class="toast" id="toast"></div>

<div class="thanks" id="thanksPage">
  <div class="box">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" fill="#4caf50"/></svg></div>
    <h2>感谢您的反馈！</h2>
    <p>您的问卷已提交成功，<br>我们将认真汇总每一份意见，<br>感谢您的支持！</p>
    <div class="tip" style="margin-top:16px;font-size:12px;color:#aaa;background:#f7f8fa;border-radius:8px;padding:10px;">本问卷一人填写一次即可，无需重复提交</div>
  </div>
</div>

<div class="error-box" id="errorBox" style="display:none">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" width="40" height="40"><path d="M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z" fill="#e53935"/></svg></div>
  <h2 id="errTitle">无法填写</h2>
  <p id="errMsg">问卷不存在或已结束。</p>
</div>

<script>
var SURVEY = null;
var qs = new URLSearchParams(location.search);
var SURVEY_ID = parseInt(qs.get('id') || '0', 10);

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2600);
}

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showError(title, msg) {
  document.getElementById('header').style.display = 'none';
  document.getElementById('qWrap').style.display = 'none';
  document.getElementById('errorBox').style.display = 'block';
  document.getElementById('errTitle').textContent = title;
  document.getElementById('errMsg').textContent = msg;
}

function getCookie(name) {
  var m = document.cookie.match('(^|;)\\s*' + name + '=([^;]+)');
  return m ? decodeURIComponent(m[2]) : '';
}
function setCookie(name, val, days) {
  var d = new Date();
  d.setTime(d.getTime() + (days || 365) * 24 * 60 * 60 * 1000);
  document.cookie = name + '=' + encodeURIComponent(val) + ';expires=' + d.toUTCString() + ';path=/';
}
function filledCookieName() { return 'survey_filled_' + SURVEY_ID; }

function showThanks() {
  document.getElementById('header').style.display = 'none';
  document.getElementById('qWrap').style.display = 'none';
  document.getElementById('thanksPage').style.display = 'block';
  window.scrollTo(0, 0);
}

function render() {
  document.getElementById('header').style.display = 'block';
  document.getElementById('qWrap').style.display = 'block';
  document.getElementById('qTitle').textContent = SURVEY.title || '问卷填写';
  document.getElementById('qDesc').textContent = SURVEY.description || '';
  document.getElementById('qAnon').style.display = SURVEY.anonymous == 1 ? 'inline-block' : 'none';
  document.getElementById('qAnon').textContent = SURVEY.anonymous == 1 ? '🔒 匿名问卷 · 数据仅用于改进' : '📋 实名问卷';
  document.getElementById('qFooter').textContent = SURVEY.end_time ? '问卷截止时间：' + SURVEY.end_time : '本问卷由公司统一发布';

  var html = '';
  (SURVEY.questions || []).forEach(function(q, qi) {
    var req = q.required ? '<span class="req">*</span>' : '';
    html += '<div class="q"><div class="t">' + (qi + 1) + '. ' + esc(q.title) + req + '</div>';
    if (q.type === 'radio' || q.type === 'multi') {
      var t = q.type === 'radio' ? 'radio' : 'checkbox';
      (q.options || []).forEach(function(opt, oi) {
        html += '<label class="opt"><input type="' + t + '" name="q_' + q.id + '" value="' + esc(opt) + '" data-qid="' + q.id + '"><span class="txt">' + esc(opt) + '</span></label>';
      });
      if (q.type === 'multi') html += '<div style="font-size:11px;color:#999;margin:-2px 0 4px 25px">可多选</div>';
    } else if (q.type === 'text') {
      html += '<textarea name="q_' + q.id + '" data-qid="' + q.id + '" placeholder="请输入内容"></textarea>';
    } else if (q.type === 'score') {
      var dims = q.options || [];
      html += '<table class="score-table"><tr><th>评分项</th><th style="width:70px">满分</th><th style="width:90px">您的打分</th></tr>';
      dims.forEach(function(d, di) {
        html += '<tr><td>' + esc(d.label || ('维度' + (di + 1))) + '</td><td>' + d.max + '</td>'
              + '<td><input type="number" min="0" max="' + d.max + '" step="1" data-qid="' + q.id + '" data-di="' + di + '" data-max="' + d.max + '" placeholder="0-' + d.max + '" oninput="calcScore(this)"></td></tr>';
      });
      html += '<tr class="total-row"><td>合计</td><td>' + dims.reduce(function(s, d){ return s + (d.max || 0); }, 0) + ' 分</td><td><span id="total_' + q.id + '">0</span> 分</td></tr></table>';
    }
    html += '</div>';
  });
  document.getElementById('qList').innerHTML = html;
}

function calcScore(inp) {
  var qid = inp.getAttribute('data-qid');
  var total = 0;
  document.querySelectorAll('input[data-qid="' + qid + '"]').forEach(function(i){
    var v = parseInt(i.value || '0', 10);
    if (isNaN(v)) v = 0;
    var max = parseInt(i.getAttribute('data-max'), 10);
    if (v < 0) v = 0; if (v > max) { v = max; i.value = v; }
    total += v;
  });
  document.getElementById('total_' + qid).textContent = total;
}

function collectAnswers() {
  var answers = {};
  (SURVEY.questions || []).forEach(function(q) {
    if (q.type === 'radio') {
      var el = document.querySelector('input[name="q_' + q.id + '"]:checked');
      answers[q.id] = el ? el.value : '';
    } else if (q.type === 'multi') {
      var arr = [];
      document.querySelectorAll('input[name="q_' + q.id + '"]:checked').forEach(function(e){ arr.push(e.value); });
      answers[q.id] = arr;
    } else if (q.type === 'text') {
      var t = document.querySelector('textarea[data-qid="' + q.id + '"]');
      answers[q.id] = t ? t.value : '';
    } else if (q.type === 'score') {
      var dims = [], total = 0, empty = false;
      document.querySelectorAll('input[data-qid="' + q.id + '"]').forEach(function(i){
        var v = i.value;
        if (v === '' || v == null) { empty = true; }
        dims.push(parseInt(v || '0', 10));
      });
      if (empty && q.required) return { fail: q };
      dims.forEach(function(v){ total += v; });
      answers[q.id] = { dims: dims, total: total };
    }
  });
  return answers;
}

function submitSurvey() {
  var answers = collectAnswers();
  if (answers.fail) { toast('请为题目评分：' + answers.fail.title); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;

  // 前端必填校验
  for (var i = 0; i < (SURVEY.questions || []).length; i++) {
    var q = SURVEY.questions[i];
    if (!q.required) continue;
    var v = answers[q.id];
    if (q.type === 'text' && !String(v).trim()) { toast('请填写题目：' + q.title); btn.disabled = false; return; }
    if (q.type === 'radio' && !v) { toast('请选择题目：' + q.title); btn.disabled = false; return; }
    if (q.type === 'multi' && (!v || v.length === 0)) { toast('请选择题目：' + q.title); btn.disabled = false; return; }
  }

  fetch('/api/survey/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'survey_id=' + SURVEY.id + '&answers=' + encodeURIComponent(JSON.stringify(answers))
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.ok || d.code === 0) {
      setCookie(filledCookieName(), '1', 365);
      showThanks();
    }
    else { toast(d.msg || '提交失败，请重试'); btn.disabled = false; }
  }).catch(function(){ toast('网络错误，请重试'); btn.disabled = false; });
}

// 加载问卷
fetch('/api/survey/view?id=' + SURVEY_ID)
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d.code === 0) {
      SURVEY = d.data;
      // 限填一次：前端先检查 Cookie，已填过直接提示
      if (SURVEY.limit_once == 1 && getCookie(filledCookieName()) === '1') {
        showError('您已填写过', '本问卷每人限填一次，感谢您的参与！');
        return;
      }
      render();
    } else {
      showError('无法填写', d.msg || '问卷不存在或已结束。');
    }
  })
  .catch(function(){ showError('无法填写', '网络错误，请稍后重试。'); });
</script>
</body>
</html>
