ons", "d": "接口"}, {"m": "GET", "p": "/mobile/announcement/list", "a": "AnnouncementMobileController/list", "d": "列表查询"}, {"m": "GET", "p": "/mobile/announcement/detail", "a": "AnnouncementMobileController/detail", "d": "详情查询"}], "其他": []};
const MOD_COLORS = {"控制台": "m-c0", "人事管理": "m-c1", "经营管理": "m-c2", "仓储管理": "m-c3", "生产管理": "m-c4", "安全管理": "m-c5", "设备管理": "m-c6", "系统设置": "m-c7", "系统维护": "m-c8", "AI智能平台": "m-c9", "统一审批": "m-c10", "移动端": "m-c11"};
const state = { items: [], filtered: [] };
state.items = [];
Object.keys(DATA).forEach(g => DATA[g].forEach(it => state.items.push({ g, ...it })));
state.filtered = state.items;
let activeIdx = -1;
const collapsed = {};

function methodColor(m) { return 'm-' + m; }
function modColor(g) { return MOD_COLORS[g] || 'm-c4'; }

function render() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  state.filtered = kw ? state.items.filter(it =>
    it.p.toLowerCase().includes(kw) || (it.d||'').toLowerCase().includes(kw) || (it.a||'').toLowerCase().includes(kw)
  ) : state.items;
  const list = document.getElementById('list');
  list.innerHTML = '';
  let lastG = null;
  state.filtered.forEach((it, idx) => {
    if (it.g !== lastG) {
      lastG = it.g;
      const cnt = state.filtered.filter(x => x.g === it.g).length;
      const d = document.createElement('div');
      d.className = 'modal-name ' + modColor(it.g) + (collapsed[it.g] ? ' collapsed' : '');
      d.innerHTML = '<span>📂 ' + it.g + ' <span class="cnt">' + cnt + '</span></span><span class="arrow">▼</span>';
      d.onclick = () => { collapsed[it.g] = !collapsed[it.g]; render(); };
      list.appendChild(d);
      const body = document.createElement('div');
      body.className = 'modal-body';
      body.dataset.g = it.g;
      list.appendChild(body);
    }
    if (collapsed[it.g]) return;
    const body = list.querySelector('.modal-body[data-g="' + it.g + '"]');
    const div = document.createElement('div');
    div.className = 'api-item' + (idx === activeIdx ? ' active' : '');
    div.dataset.idx = idx;
    div.innerHTML = '<div class="top"><span class="method ' + methodColor(it.m) + '">' + it.m + '</span><span class="path">' + it.p + '</span></div><div class="desc">' + (it.d || '') + '</div>';
    div.onclick = () => select(idx);
    body.appendChild(div);
  });
}

function select(idx) {
  activeIdx = idx;
  render();
  const it = state.filtered[idx];
  const detail = document.getElementById('detail');
  detail.className = 'card';
  detail.innerHTML = `
    <h2><span class="method ${methodColor(it.m)}">${it.m}</span> ${it.p}</h2>
    <div class="card-desc">${it.d || ''}</div>
    <div class="info-row"><div class="k">业务模块</div><div class="v">${it.g}</div></div>
    <div class="info-row"><div class="k">控制器</div><div class="v">${it.a || '-'}</div></div>
    <div class="info-row"><div class="k">完整地址</div><div class="v">/api${it.p}</div></div>
    <div class="test-area">
      <div style="font-size:13px;color:#606266;margin-bottom:6px">请求参数（JSON，GET 将拼为查询串）</div>
      <textarea class="body-input" id="reqBody" placeholder='{}'></textarea>
      <button class="btn-test" id="btnTest">⚡ 测试</button>
    </div>
    <div class="result" id="result" style="display:none">
      <div class="res-head"><span id="resStatus"></span><span style="cursor:pointer" onclick="document.getElementById('result').style.display='none'">✕</span></div>
      <pre id="resBody"></pre>
    </div>`;
  document.getElementById('btnTest').onclick = () => test(it);
}

async function test(it) {
  const btn = document.getElementById('btnTest');
  const resBox = document.getElementById('result');
  const resStatus = document.getElementById('resStatus');
  const resBody = document.getElementById('resBody');
  const token = localStorage.getItem('sc_admin_token') || '';
  btn.disabled = true; btn.textContent = '测试中…';
  resBox.style.display = 'block'; resStatus.textContent = '请求中…'; resBody.textContent = '';
  let body = {};
  try { body = JSON.parse(document.getElementById('reqBody').value || '{}'); }
  catch (e) { toast('JSON 格式错误'); btn.disabled = false; btn.textContent = '⚡ 测试'; return; }
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  let url = '/api' + it.p;
  const opts = { method: it.m, headers };
  if (it.m === 'GET' || it.m === 'DELETE') {
    const qs = new URLSearchParams();
    Object.keys(body).forEach(k => qs.append(k, body[k]));
    const q = qs.toString();
    if (q) url += (url.includes('?') ? '&' : '?') + q;
  } else { opts.body = JSON.stringify(body); }
  try {
    const resp = await fetch(url, opts);
    const text = await resp.text();
    resStatus.textContent = 'HTTP ' + resp.status;
    try { resBody.textContent = JSON.stringify(JSON.parse(text), null, 2); }
    catch (e) { resBody.textContent = text; }
  } catch (e) { resStatus.textContent = '请求失败'; resBody.textContent = String(e); }
  btn.disabled = false; btn.textContent = '⚡ 测试';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}
document.getElementById('search').addEventListener('input', render);
render();
</script>
