<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环境检测 - 数智管控平台 系统安装</title>
<link rel="stylesheet" href="/install/css/installer.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="steps">
      <div class="step done"><span class="dot">✓</span> 环境检测</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">2</span> 数据库</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">3</span> 管理员</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">4</span> 安装</div>
    </div>
    <h1>环境检测</h1>
    <div class="summary {{summary_cls}}">{{summary_text}}</div>
    <div class="checks">
      {{checks}}
    </div>
    <div class="actions">
      {{next_btn}}
    </div>
  </div>
  <div class="footer">© 2026 数智管控平台</div>
</div>
</body>
</html>
