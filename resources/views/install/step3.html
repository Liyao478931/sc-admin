<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员账号 - 数智管控平台 系统安装</title>
<link rel="stylesheet" href="/install/css/installer.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="steps">
      <div class="step done"><span class="dot">✓</span> 环境检测</div>
      <div class="step-line"></div>
      <div class="step done"><span class="dot">✓</span> 数据库</div>
      <div class="step-line"></div>
      <div class="step active"><span class="dot">3</span> 管理员</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">4</span> 安装</div>
    </div>
    <h1>管理员账号设置</h1>
    <div id="msg" class="msg"></div>
    <form id="adminForm">
      <div class="form-item">
        <label>管理员用户名（至少 4 位，字母/数字/下划线）</label>
        <input type="text" name="username" placeholder="admin">
      </div>
      <div class="form-item">
        <label>管理员密码（至少 6 位）</label>
        <input type="password" name="password" placeholder="请输入密码">
      </div>
      <div class="form-item">
        <label>确认密码</label>
        <input type="password" name="confirm" placeholder="再次输入密码">
      </div>
      <div class="form-item">
        <label>管理员邮箱</label>
        <input type="text" name="email" placeholder="admin@example.com">
      </div>
    </form>
    <div class="actions">
      <a class="btn ghost" href="/install/step2">上一步</a>
      <button class="btn primary" id="installBtn">开始安装</button>
    </div>
  </div>
  <div class="footer">© 2026 数智管控平台</div>
</div>
<script>
var msg = document.getElementById('msg');
document.getElementById('installBtn').addEventListener('click', function () {
  var btn = this;
  btn.disabled = true;
  var data = new URLSearchParams(new FormData(document.getElementById('adminForm'))).toString();
  fetch('/install/step3', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: data })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.code === 0) { window.location.href = '/install/step4'; }
      else { msg.className = 'msg err'; msg.textContent = res.msg || '提交失败'; btn.disabled = false; }
    })
    .catch(function () { msg.className = 'msg err'; msg.textContent = '请求失败，请检查网络'; btn.disabled = false; });
});
</script>
</body>
</html>
